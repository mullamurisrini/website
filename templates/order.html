{% extends "base.html" %}
{% block title %}Place Order | Mini Shop{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('product_details', id=product.id) }}">← Back to product</a>
<section class="form-card">
    <p class="eyebrow">CHECKOUT</p>
    <h1>Place your order</h1>
    <div class="order-summary">
        <div><strong>{{ product.name }}</strong><span>₹{{ "%.2f"|format(product.price) }} per item</span></div>
        <span class="summary-icon">🛒</span>
    </div>
    <form method="POST" action="{{ url_for('order', id=product.id) }}">
        <label for="customer_name">Customer name</label>
        <input type="text" id="customer_name" name="customer_name" placeholder="Enter your full name" value="{{ request.form.get('customer_name', '') }}" required>

        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" min="1" step="1" value="{{ request.form.get('quantity', '1') }}" required>

        <button class="button full-width" type="submit">Confirm order</button>
    </form>
</section>
{% endblock %}
